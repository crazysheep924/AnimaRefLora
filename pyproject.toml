[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anima-reflora"
version = "0.1.0"
description = "Docker/RunPod training harness for Anima reference LoRA experiments."
requires-python = ">=3.11"
license = {file = "LICENSE"}
# torch is intentionally loose: the Docker base image ships a CUDA build that
# must not be clobbered. Pins for the full stack live in requirements.txt.
dependencies = [
    "torch>=2.8",
    "accelerate>=1.6",
    "dghs-imgutils>=0.19",
    "diffusers>=0.32",
    "einops>=0.7",
    "ftfy>=6.3",
    "huggingface-hub>=0.34",
    "imagesize>=1.4",
    "lycoris-lora>=3.4",
    "numpy>=1.26,<2",
    "opencv-python>=4.10",
    "pandas>=2.2",
    "pillow>=10",
    "pyarrow>=16",
    "rich>=13",
    "safetensors>=0.4",
    "sentencepiece>=0.2",
    "tensorboard>=2.16",
    "toml>=0.10",
    "tqdm>=4.66",
    "transformers>=4.54",
    "voluptuous>=0.15",
]

[tool.setuptools.packages.find]
include = ["anima_reflora*"]

[project.scripts]
anima-reflora-train = "anima_reflora.train:main"
anima-reflora-plan = "anima_reflora.train_plan:main"
anima-reflora-preflight = "anima_reflora.preflight:main"
anima-reflora-head-cache = "anima_reflora.head_cache:main"
anima-reflora-head-ccip-cache = "anima_reflora.ccip_head_cache:main"
anima-reflora-head-roi-cache = "anima_reflora.build_head_roi_cache:main"
anima-reflora-ccip-cache = "anima_reflora.build_ccip_ref_cache:main"
anima-reflora-training-cache = "anima_reflora.build_training_cache:main"
anima-reflora-ref-use-eval = "anima_reflora.ref_use_eval:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["sd-scripts", ".git", ".pytest_cache", "__pycache__"]
